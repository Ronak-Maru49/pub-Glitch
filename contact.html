<h2>
MAKE A BOOKING
</h2>


<form class="booking-form">

<div class="form-group">

<select required>

<option value="">

</option>

<option>
Central London
</option>

<option>
Riverside London
</option>

</select>

</div>

       required>

</div>

<select required>

<option value="">

</option>

<option>2 Guests</option>

<option>3 Guests</option>

<option>4 Guests</option>

<option>5 Guests</option>

<option>6+ Guests</option>

</select>

</div>


<div class="form-group">

<input type="text"
       placeholder="Your Name"
       required>

</div>


<div class="form-group">

<input type="email"
       placeholder="Email Address"
       required>

</div>


<button class="btn btn-primary"
        type="submit">

REQUEST BOOKING

</button>
